<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnglisHub · تعلّم الإنجليزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26234B; --ink2:#5A5780; --bg:#FFFBF4; --line:#EFE7D8;
  --coral:#F0524F; --coral-t:#FFEBEA;
  --sun:#FFB300;   --sun-t:#FFF4D1;
  --mint:#14A58A;  --mint-t:#DDF6F0;
  --sky:#2F8FE6;   --sky-t:#E1F0FE;
  --grape:#7C4DFF; --grape-t:#ECE5FF;
  --pink:#E8449A;  --pink-t:#FFE3F1;
  --radius:28px;
  --font:'Baloo Bhaijaan 2','Cairo','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:1.35;
  display:flex;flex-direction:column;overflow-x:hidden;
}
a{color:inherit}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px;border-radius:12px}
h1,h2,h3,p{margin:0}

/* floating background shapes */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;opacity:.55;animation:float 14s ease-in-out infinite}
.bg i:nth-child(1){width:260px;height:260px;background:var(--sun-t);top:-70px;left:-60px}
.bg i:nth-child(2){width:200px;height:200px;background:var(--sky-t);top:18%;right:-70px;animation-delay:-4s}
.bg i:nth-child(3){width:240px;height:240px;background:var(--pink-t);bottom:8%;left:-80px;animation-delay:-8s}
.bg i:nth-child(4){width:170px;height:170px;background:var(--mint-t);bottom:-50px;right:12%;animation-delay:-2s}
.bg i:nth-child(5){width:110px;height:110px;background:var(--grape-t);top:55%;left:48%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}

.layer{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 20px}

/* bilingual text */
.bi{display:flex;flex-direction:column;align-items:flex-start}
.bi .ar{direction:rtl;font-family:var(--font);}
.ctr,.ctr .bi{align-items:center;text-align:center}
.bi.row{flex-direction:row;gap:.5em;align-items:baseline;flex-wrap:wrap}
.ar{unicode-bidi:isolate}

/* logo */
.logo{font-weight:800;letter-spacing:.5px;line-height:1;display:inline-block;text-decoration:none}
.logo b{display:inline-block;transition:transform .25s}
.logo:hover b{transform:translateY(-4px) rotate(-6deg)}
.logo b:nth-child(1){color:var(--coral)}.logo b:nth-child(2){color:var(--sun)}
.logo b:nth-child(3){color:var(--mint)}.logo b:nth-child(4){color:var(--sky)}
.logo b:nth-child(5){color:var(--grape)}.logo b:nth-child(6){color:var(--pink)}
.logo b:nth-child(7){color:var(--coral)}.logo b:nth-child(8){color:var(--mint)}
.logo b:nth-child(9){color:var(--sky)}

/* buttons */
.btn{
  font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;border:0;
  background:var(--ink);color:#fff;padding:12px 28px;border-radius:999px;
  box-shadow:0 6px 0 rgba(38,35,75,.25);transition:transform .12s,box-shadow .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(38,35,75,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(38,35,75,.25)}
.btn.ghost{background:#fff;color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(38,35,75,.15);padding:8px 20px;font-size:1rem}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn .bi{align-items:center;line-height:1.15}

/* ---------- LOGIN ---------- */
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 0 20px;gap:26px}
.login .logo{font-size:clamp(3rem,10vw,4.6rem)}
.tagline{color:var(--ink2);font-weight:600;font-size:1.15rem}
.login-card{
  width:100%;max-width:440px;background:#fff;border-radius:34px;padding:30px 28px 30px;
  box-shadow:0 18px 50px rgba(38,35,75,.10),0 2px 0 var(--line);border:2px solid var(--line);
}
.quote{min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;transition:opacity .45s}
.quote.fade{opacity:0}
.quote .qa{font-family:'Amiri','Baloo Bhaijaan 2',serif;font-size:1.75rem;line-height:1.7;color:var(--ink);direction:rtl}
.quote .qe{color:var(--ink2);font-size:1.02rem;font-weight:600}
.quote .qs{font-size:.88rem;font-weight:800;padding:2px 14px;border-radius:999px;background:var(--sun-t);color:#7a5200;display:inline-flex;gap:8px;align-items:baseline}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0 22px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:transform .2s,background .2s}
.dots button[aria-current="true"]{background:var(--grape);transform:scale(1.35)}
.dots button:focus-visible{outline-offset:4px}
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:800}
label .bi.row{font-size:.98rem}
input[type=text],input[type=password]{
  font:inherit;font-size:1.05rem;padding:13px 18px;border-radius:18px;border:2.5px solid var(--line);
  background:#FFFDF9;color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s;
}
input:focus{outline:none;border-color:var(--grape);box-shadow:0 0 0 5px var(--grape-t)}
.err{display:none;background:var(--coral-t);color:#a1191a;border-radius:16px;padding:10px 16px;font-weight:600}
.err.show{display:flex;flex-direction:column;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- HEADER ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.top .logo{font-size:2rem}
.who{display:flex;align-items:center;gap:12px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);padding:4px 16px 4px 5px;border-radius:999px;font-weight:800}
.chip .mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem}

main{flex:1;padding-bottom:30px}
main:focus{outline:none}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(38,35,75,.06)}

/* profile */
.profile{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:24px;align-items:center;margin-top:6px}
.avatar{width:104px;height:104px;border-radius:32px;display:grid;place-items:center;font-size:3.4rem;box-shadow:0 8px 0 rgba(38,35,75,.12);transform:rotate(-4deg)}
.hello{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:800;line-height:1.15}
.uname{color:var(--ink2);font-size:.9rem;font-weight:600;margin:2px 0 10px;word-break:break-all}
.prog-label{font-weight:800;font-size:.95rem}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 0;max-width:420px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--sky),var(--grape));transition:width .6s}
.picker{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-top:2px dashed var(--line);padding-top:14px}
.picker .opts{display:flex;gap:6px;flex-wrap:wrap}
.picker button{width:44px;height:44px;border-radius:14px;border:2.5px solid transparent;background:var(--bg);font-size:1.5rem;cursor:pointer;transition:transform .15s}
.picker button:hover{transform:scale(1.15) rotate(-5deg)}
.picker button[aria-pressed="true"]{border-color:var(--ink);background:#fff}

.sec-title{margin:30px 0 14px;font-size:1.4rem;font-weight:800}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.term{
  display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:34px;text-decoration:none;color:var(--ink);
  border:3px solid var(--c);background:var(--t);position:relative;overflow:hidden;
  box-shadow:0 10px 0 var(--c);transition:transform .18s,box-shadow .18s;
}
.term:hover{transform:translateY(-4px);box-shadow:0 14px 0 var(--c)}
.term:active{transform:translateY(6px);box-shadow:0 4px 0 var(--c)}
.term .big{font-size:3.4rem;line-height:1}
.term h2{font-size:2.1rem;font-weight:800;line-height:1.05}
.term .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:baseline;background:#fff;border-radius:999px;padding:3px 14px;font-weight:800;font-size:.9rem;border:2px solid var(--c,var(--line))}
.term::after{content:'';position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:var(--c);opacity:.14}

/* page heading + back */
.crumbs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 20px}
.page-title{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;line-height:1.05}

/* lessons grid */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.lesson{
  display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:26px;text-decoration:none;color:var(--ink);
  background:var(--t);border:3px solid var(--c);position:relative;transition:transform .18s;
}
.lesson:hover{transform:translateY(-5px) rotate(-1deg)}
.lesson .num{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:1.9rem;font-weight:800;background:var(--c);color:var(--fg);box-shadow:0 5px 0 rgba(38,35,75,.15)}
.lesson h3{font-size:1.35rem;font-weight:800;line-height:1.1}
.status{font-size:.88rem;font-weight:700;display:flex;flex-direction:column;gap:0}
.status .st{display:inline-flex;gap:6px;align-items:center}
.done-badge{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(38,35,75,.2)}

/* lesson page */
.lesson-hero{display:flex;gap:20px;align-items:center;padding:24px;border-radius:32px;background:var(--t);border:3px solid var(--c);margin-bottom:22px;flex-wrap:wrap}
.lesson-hero .num{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;font-size:2.8rem;font-weight:800;background:var(--c);color:var(--fg);box-shadow:0 7px 0 rgba(38,35,75,.15)}
.zone{padding:26px;border-radius:32px;background:#fff;border:3px dashed var(--c)}
.zone h2{font-size:1.5rem;font-weight:800;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pending{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 10px 20px;background:var(--t);border-radius:24px}
.pending .ico{font-size:4rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.pending .pill{margin-top:4px}
.docs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.doc{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--t);border:2.5px solid var(--c);text-decoration:none;font-weight:800;transition:transform .15s}
.doc:hover{transform:translateY(-3px)}
.doc .di{font-size:1.9rem}
.doc small{font-weight:700;color:var(--ink2)}
.finish{display:flex;justify-content:center;margin-top:24px}
.btn.finished{background:var(--mint)}
.pop{animation:pop .45s}
#welcomeBtn,#musicBtn{margin-top:14px}
#musicBtn{margin-inline-start:10px}
#welcomeBtn.pulse,#musicBtn.pulse{animation:pulse 1.4s ease-in-out infinite;border-color:var(--grape);color:var(--grape)}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 8px var(--grape-t)}}
@keyframes pop{40%{transform:scale(1.12)}}

/* ---------- TEACHER CREDIT ---------- */
.credit{padding:22px 0 26px;display:flex;justify-content:center}
.teacher{
  display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;justify-content:center;
  background:#fff;border:2px solid var(--line);border-radius:26px;padding:12px 22px;
  box-shadow:0 8px 24px rgba(38,35,75,.06);
}
.mu3allim{
  font-family:'Amiri','Baloo Bhaijaan 2',serif;font-weight:700;font-size:1.9rem;line-height:1.3;padding:0 10px;
  background:linear-gradient(transparent 52%,var(--sun) 52%,var(--sun) 92%,transparent 92%);
  border-radius:6px;
}
.t-name{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-weight:600;color:var(--ink2);font-size:.9rem}
.t-name b{color:var(--ink);font-size:1.15rem;font-weight:800}
.t-name .ar{font-size:1.05rem;font-weight:700;color:var(--ink)}
.wa{background:#1FA855;color:#fff;font-weight:800;padding:8px 18px;border-radius:999px;text-decoration:none;display:inline-flex;gap:8px;align-items:center;font-size:.95rem;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s}
.wa:hover{transform:translateY(-2px)}
.love{text-align:center;color:var(--ink2);font-size:.85rem;font-weight:600;padding-bottom:6px}

@media (max-width:560px){
  body{font-size:16px}
  .profile{grid-template-columns:1fr;text-align:center;justify-items:center}
  .profile .bi{align-items:center}
  .bar{margin-inline:auto}
  .top{justify-content:center}
  .login-card{padding:24px 20px}
  .quote .qa{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<script>

/* Terms and number of lessons in each (change the numbers freely). */

*/

  ]

/* Teacher credit */
const TEACHER = { en:'Ishak Zerdazi', ar:'إسحاق زردازي', wa:'213795369006', waShow:'+213 795 36 90 06' };

/* Welcome recording: plays automatically right after a learner logs in.
   Put your audio file in a folder next to this page and write its path here.

const WELCOME_AUDIO = 'welcome.mp3';

/* Background music: loops quietly behind everything after login. Volume 0.07 = 7%. */
const MUSIC_VOLUME = 0.07;
const BG_MUSIC = 'music.mp3';

/* Quotes shown on the entrance page */
const QUOTES = [
  { ar:'وَقُل رَّبِّ زِدْنِي عِلْمًا', en:'Say: “My Lord, increase me in knowledge.”', sEn:'Qur’an 20:114', sAr:'سورة طه ١١٤' },
  { ar:'طَلَبُ العِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ', en:'Seeking knowledge is a duty upon every Muslim.', sEn:'Hadith', sAr:'حديث شريف' },
  { ar:'العِلْمُ نُورٌ وَالجَهْلُ ظَلَامٌ', en:'Knowledge is light and ignorance is darkness.', sEn:'Wisdom', sAr:'حكمة' },
  { ar:'هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ', en:'Are those who know equal to those who do not know?', sEn:'Qur’an 39:9', sAr:'سورة الزمر ٩' }
];

const PALETTE = [
  { c:'var(--coral)', t:'var(--coral-t)', fg:'#fff' },
  { c:'var(--sun)',   t:'var(--sun-t)',   fg:'#26234B' },
  { c:'var(--mint)',  t:'var(--mint-t)',  fg:'#fff' },
  { c:'var(--sky)',   t:'var(--sky-t)',   fg:'#fff' },
  { c:'var(--grape)', t:'var(--grape-t)', fg:'#fff' },
  { c:'var(--pink)',  t:'var(--pink-t)',  fg:'#fff' }
];
const AVATARS = ['🦁','🦋','🚀','🐼','🦊','🐬','🌟','🐯'];

/* =====================================================================
   Helpers
   ===================================================================== */
const root = document.getElementById('root');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(n).padStart(2,'0');
const bi = (en, ar, cls='') => `<span class="bi ${cls}"><span class="en">${en}</span><span class="ar" lang="ar" dir="rtl">${ar}</span></span>`;
const store = {
  get(s,k,d){ try{ const v=(s==='s'?sessionStorage:localStorage).getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(s,k,v){ try{ (s==='s'?sessionStorage:localStorage).setItem(k,v); }catch(e){} },
  del(s,k){ try{ (s==='s'?sessionStorage:localStorage).removeItem(k); }catch(e){} }
};
let quoteTimer = null;

/* ---- SHA-256 (uses WebCrypto; pure-JS fallback if unavailable) ---- */
/*SHA-BEGIN*/
function sha256Bytes(bytes){
  const K=[],H=[]; let n=2,c=0;
  while(c<64){ let p=true; for(let i=2;i*i<=n;i++){ if(n%i===0){p=false;break;} }
    if(p){ if(c<8) H[c]=(Math.pow(n,1/2)%1*4294967296)|0; K[c]=(Math.pow(n,1/3)%1*4294967296)|0; c++; } n++; }
  const l=bytes.length, total=((l+9+63)>>6)<<6, buf=new Uint8Array(total);
  buf.set(bytes); buf[l]=0x80;
  const dv=new DataView(buf.buffer); dv.setUint32(total-8,Math.floor(l*8/4294967296)); dv.setUint32(total-4,(l*8)>>>0);
  const w=new Array(64), rr=(x,s)=>(x>>>s)|(x<<(32-s));
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b,c2,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c2)^(b&c2), t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
/*SHA-END*/
async function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  try{
    if(window.crypto && crypto.subtle){
      const d = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256Bytes(bytes);
}
const credHash = (u,p) => sha256Hex('englishub-v1|'+u.toLowerCase()+'|'+p);

/* ---- welcome audio ---- */
let welcomeEl = null;
const welcomeSrc = l => (l && l.audio) || WELCOME_AUDIO || '';
/* Called synchronously inside the login click, so the browser lets the sound play later. */
function prepareWelcome(username){
  const l = LEARNERS.find(x => x.user.toLowerCase() === username), src = welcomeSrc(l);
  if(!src) return null;
  const a = new Audio(src); a.preload = 'auto'; a.muted = true; a.dataset.src = src;
  try{ const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); a.pause(); }catch(e){}
  return a;
}
function syncWelcomeBtn(){
  const b = document.getElementById('welcomeBtn'); if(!b) return;
  const on = !!welcomeEl && !welcomeEl.paused;
  b.classList.remove('pulse');
  b.setAttribute('aria-pressed', on);
  b.innerHTML = on ? bi('⏸ Pause the welcome message','إيقاف رسالة الترحيب','ctr') : bi('🔊 Play the welcome message','🔊 تشغيل رسالة الترحيب','ctr');
}
function playWelcome(src){
  if(!src) return;
  if(!welcomeEl || welcomeEl.dataset.src !== src){
    stopWelcome(); welcomeEl = new Audio(src); welcomeEl.dataset.src = src;
  }
  const a = welcomeEl;
  ['play','pause','ended'].forEach(ev => a.addEventListener(ev, syncWelcomeBtn));
  a.muted = false; if(a.ended) a.currentTime = 0;
  const pr = a.play();
  if(pr && pr.catch) pr.catch(() => { const b=document.getElementById('welcomeBtn'); if(b) b.classList.add('pulse'); });
}
function stopWelcome(){ if(welcomeEl){ try{ welcomeEl.pause(); }catch(e){} welcomeEl = null; } }

/* ---- background music (7% volume, loops) ---- */
let musicEl = null;
function prepareMusic(){
  if(!BG_MUSIC) return null;
  const a = new Audio(BG_MUSIC); a.loop = true; a.preload = 'auto'; a.volume = MUSIC_VOLUME; a.muted = true;
  try{ const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); a.pause(); }catch(e){}
  return a;
}
function syncMusicBtn(){
  const b = document.getElementById('musicBtn'); if(!b) return;
  const on = !!musicEl && !musicEl.paused;
  b.classList.remove('pulse');
  b.setAttribute('aria-pressed', on);
  b.innerHTML = on ? bi('🎵 Music: on','🎵 الموسيقى: تعمل','ctr') : bi('🔇 Music: off','🔇 الموسيقى: متوقفة','ctr');
}
function playMusic(){
  if(!musicEl) musicEl = prepareMusic();
  if(!musicEl) return;
  const a = musicEl;
  if(!a.dataset.bound){ a.dataset.bound='1'; ['play','pause'].forEach(ev => a.addEventListener(ev, syncMusicBtn)); }
  a.volume = MUSIC_VOLUME; a.muted = false;
  const pr = a.play();
  if(pr && pr.catch) pr.catch(() => { const b=document.getElementById('musicBtn'); if(b) b.classList.add('pulse'); });
}
function stopMusic(){ if(musicEl){ try{ musicEl.pause(); }catch(e){} musicEl = null; } }

/* ---- session & progress ---- */
const currentUser = () => LEARNERS.find(l => l.key === store.get('s','eh:user',''));
const avatarOf = l => store.get('l','eh:avatar:'+l.key,l.emoji);
const doneList = l => { try{ return JSON.parse(store.get('l','eh:done:'+l.key,'[]')); }catch(e){ return []; } };
const totalLessons = () => TERMS.reduce((a,t)=>a+t.lessons,0);
const docsFor = (t,n) => DOCS[t+'-'+n] || [];

/* =====================================================================
   Shared pieces
   ===================================================================== */
function logoHTML(tag='a'){
  const letters='EnglisHub'.split('').map(ch=>`<b>${ch}</b>`).join('');
  return tag==='a' ? `<a class="logo" href="#/" aria-label="EnglisHub — home">${letters}</a>` : `<h1 class="logo" aria-label="EnglisHub">${letters}</h1>`;
}
function creditHTML(){
  return `
  <footer class="credit"><div class="wrap" style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div class="teacher">
      <span class="mu3allim" lang="ar" dir="rtl">معلم</span>
      <span class="t-name"><span>Teacher</span><b>${TEACHER.en}</b><span class="ar" lang="ar" dir="rtl">${TEACHER.ar}</span></span>
      <a class="wa" href="https://wa.me/${TEACHER.wa}" target="_blank" rel="noopener" aria-label="WhatsApp ${TEACHER.en}">💬 WhatsApp <bdi dir="ltr">${TEACHER.waShow}</bdi></a>
    </div>
    <p class="love">Made with ♥ for young learners · <span lang="ar" dir="rtl">صُنع بحب للمتعلمين الصغار</span></p>
  </div></footer>`;
}
function headerHTML(l){
  return `<header class="wrap top">
    ${logoHTML('a')}
    <div class="who">
      <span class="chip"><span class="mini" style="background:${l.color}" aria-hidden="true">${avatarOf(l)}</span>${l.en} · <span lang="ar" dir="rtl">${l.ar}</span></span>
      <button class="btn ghost" id="logout">${bi('Log out','خروج','ctr')}</button>
    </div>
  </header>`;
}
function page(l, inner, title){
  clearInterval(quoteTimer);
  root.innerHTML = `${headerHTML(l)}<main class="wrap" id="main" tabindex="-1">${inner}</main>${creditHTML()}`;
  document.title = title + ' · EnglisHub';
  document.getElementById('logout').onclick = () => { stopWelcome(); stopMusic(); store.del('s','eh:user'); location.hash='#/'; route(); };
  const m=document.getElementById('main'); m.focus({preventScroll:true}); window.scrollTo(0,0);
  return m;
}

/* =====================================================================
   Views
   ===================================================================== */
function renderLogin(){
  document.title = 'EnglisHub · تعلّم الإنجليزية';
  root.innerHTML = `
  <main class="wrap login" id="main">
    ${logoHTML('h1')}
    <p class="tagline ctr">${bi('Your happy place to learn English','مكانك السعيد لتعلّم الإنجليزية','ctr')}</p>
    <section class="login-card" aria-label="Login">
      <div class="quote" id="quote" aria-live="off"></div>
      <div class="dots" id="dots" role="group" aria-label="Quotes"></div>
      <form id="form" novalidate autocomplete="on">
        <label for="u">${bi('Username','اسم المستخدم','row')}
          <input id="u" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </label>
        <label for="p">${bi('Password','كلمة المرور','row')}
          <input id="p" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="err" id="err" role="alert"></div>
        <button class="btn" id="go" type="submit">${bi('Let’s go! 🚀','هيا بنا!','ctr')}</button>
      </form>
    </section>
  </main>
  ${creditHTML()}`;

  /* quotes */
  const q = document.getElementById('quote'), dots = document.getElementById('dots');
  let qi = Math.floor(Math.random()*QUOTES.length);
  const show = i => {
    qi = i; const d = QUOTES[i];
    q.innerHTML = `<p class="qa" lang="ar" dir="rtl">«${d.ar}»</p><p class="qe">${d.en}</p>
      <span class="qs"><span>${d.sEn}</span><span lang="ar" dir="rtl">${d.sAr}</span></span>`;
    [...dots.children].forEach((b,k)=>b.setAttribute('aria-current', k===i));
  };
  QUOTES.forEach((_,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label','Quote '+(i+1)); b.onclick=()=>{show(i);restart();}; dots.appendChild(b); });
  const next = () => { q.classList.add('fade'); setTimeout(()=>{ show((qi+1)%QUOTES.length); q.classList.remove('fade'); }, reduceMotion?0:420); };
  const restart = () => { clearInterval(quoteTimer); if(!reduceMotion) quoteTimer=setInterval(next,9000); };
  show(qi); restart();

  /* login */
  const form=document.getElementById('form'), err=document.getElementById('err'), go=document.getElementById('go');
  const fail = msgEn => { err.innerHTML = `<span>${msgEn[0]}</span><span lang="ar" dir="rtl">${msgEn[1]}</span>`; err.classList.remove('show'); void err.offsetWidth; err.classList.add('show'); };
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const lockUntil = +store.get('s','eh:lock','0');
    if(Date.now() < lockUntil){
      const s = Math.ceil((lockUntil-Date.now())/1000);
      return fail([`Too many tries. Please wait ${s} seconds.`,`محاولات كثيرة. انتظر ${s} ثانية.`]);
    }
    const u = document.getElementById('u').value.trim().toLowerCase();
    const p = document.getElementById('p').value;
    if(!u || !p) return fail(['Please fill in both boxes.','املأ الخانتين من فضلك.']);
    const pre = prepareWelcome(u);   /* must run before any await */
    const preMusic = prepareMusic();
    go.disabled = true;
    const h = await credHash(u,p);
    const learner = LEARNERS.find(l => l.user.toLowerCase() === u);
    go.disabled = false;
    if(learner && learner.hash === h){
      store.del('s','eh:fails'); store.set('s','eh:user',learner.key);
      document.getElementById('p').value='';
      location.hash = '#/';
      if(pre){ stopWelcome(); welcomeEl = pre; }
      if(preMusic){ stopMusic(); musicEl = preMusic; }
      route();
      if(pre) playWelcome(pre.dataset.src);
      if(preMusic) playMusic();
    } else {
      if(pre){ try{ pre.pause(); }catch(e){} }
      if(preMusic){ try{ preMusic.pause(); }catch(e){} }
      const f = +store.get('s','eh:fails','0') + 1; store.set('s','eh:fails',String(f));
      if(f >= 5){ store.set('s','eh:lock',String(Date.now()+30000)); store.set('s','eh:fails','0'); }
      document.getElementById('p').value='';
      fail(['Oops! Wrong username or password.','عفواً! اسم المستخدم أو كلمة المرور غير صحيحة.']);
    }
  });
}

function renderHome(l){
  const done = doneList(l).length, total = totalLessons(), pct = total ? Math.round(done/total*100) : 0;
  const h = new Date().getHours();
  const gEn = h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening';
  const gAr = h<12 ? 'صباح الخير' : 'مساء الخير';
  const cur = avatarOf(l);
  const termCards = TERMS.map(t => {
    let pending=0; for(let n=1;n<=t.lessons;n++) if(!docsFor(t.id,n).length) pending++;
    return `<a class="term" href="#/term/${t.id}" style="--c:${t.c};--t:${t.t}">
      <span class="big" aria-hidden="true">${t.emoji}</span>
      <h2>${bi(t.en,t.ar)}</h2>
      <div class="meta">
        <span class="pill">${t.lessons} lessons · <span lang="ar" dir="rtl">${t.lessons} دروس</span></span>
      </div>
    </a>`;}).join('');
  const m = page(l, `
    <section class="card profile" aria-label="My profile">
      <div class="avatar" style="background:${l.color}" aria-hidden="true">${cur}</div>
      <div>
        <p class="hello">${bi(`${gEn}, ${l.en}! 👋`,`${gAr}، ${l.ar}!`)}</p>
        <p class="uname">${l.user}</p>
        <p class="prog-label">${done} / ${total} lessons done · <span lang="ar" dir="rtl">${done} من ${total} دروس منجزة</span></p>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        ${welcomeSrc(l) ? `<button type="button" class="btn ghost" id="welcomeBtn" aria-pressed="false"></button>` : ''}
        ${BG_MUSIC ? `<button type="button" class="btn ghost" id="musicBtn" aria-pressed="false"></button>` : ''}
      </div>
      <div class="picker">
        <strong>${bi('Pick your buddy','اختر رفيقك','row')}</strong>
        <div class="opts">${AVATARS.map(a=>`<button type="button" data-a="${a}" aria-pressed="${a===cur}" aria-label="Buddy ${a}">${a}</button>`).join('')}</div>
      </div>
    </section>
    <h2 class="sec-title">${bi('Choose your term','اختر الفصل','row')}</h2>
    <div class="terms">${termCards}</div>`, 'Home');
  m.querySelectorAll('.picker button').forEach(b => b.onclick = () => { store.set('l','eh:avatar:'+l.key,b.dataset.a); renderHome(l); });
  const wb = m.querySelector('#welcomeBtn');
  if(wb){
    syncWelcomeBtn();
    wb.onclick = () => {
      if(welcomeEl && !welcomeEl.paused){ welcomeEl.pause(); }
      else playWelcome(welcomeSrc(l));
      syncWelcomeBtn();
    };
  }
  const mb = m.querySelector('#musicBtn');
  if(mb){
    syncMusicBtn();
    mb.onclick = () => {
      if(musicEl && !musicEl.paused){ musicEl.pause(); } else playMusic();
      syncMusicBtn();
    };
  }
}

function renderTerm(l, tid){
  const t = TERMS.find(x=>x.id===tid); if(!t) return go404();
  const done = doneList(l);
  let cards='';
  for(let n=1;n<=t.lessons;n++){
    const p = PALETTE[(n-1)%PALETTE.length], d = docsFor(t.id,n), isDone = done.includes(t.id+'-'+n);
    cards += `<a class="lesson" href="#/term/${t.id}/lesson/${n}" style="--c:${p.c};--t:${p.t};--fg:${p.fg}">
      ${isDone?'<span class="done-badge" aria-label="Done">✓</span>':''}
      <span class="num" aria-hidden="true">${n}</span>
      <h3>${bi('Lesson '+pad(n),'الدرس '+pad(n))}</h3>
      <p class="status">${d.length
        ? `<span class="st">📎 ${d.length} documents</span><span class="ar" lang="ar" dir="rtl">${d.length} وثائق</span>`
        : `<span class="st">⏳ Documents pending</span><span class="ar" lang="ar" dir="rtl">الوثائق قريباً</span>`}</p>
    </a>`;
  }
  page(l, `
    <nav class="crumbs"><a class="btn ghost" href="#/">← ${bi('Back','رجوع','ctr')}</a></nav>
    <h2 class="page-title" style="margin-bottom:6px">${t.emoji} ${bi(t.en,t.ar)}</h2>
    <p style="color:var(--ink2);font-weight:600;margin-bottom:22px">${bi('Pick a lesson to open it','اختر درساً لفتحه')}</p>
    <div class="lessons">${cards}</div>`, t.en);
}

function renderLesson(l, tid, n){
  const t = TERMS.find(x=>x.id===tid);
  if(!t || !(n>=1 && n<=t.lessons)) return go404();
  const p = PALETTE[(n-1)%PALETTE.length], d = docsFor(tid,n), key = tid+'-'+n;
  const isDone = doneList(l).includes(key);
  const zone = d.length
    ? `<div class="docs">${d.map(x=>`<a class="doc" href="${x.url}" ${x.file?`download="${x.file}"`:''} target="_blank" rel="noopener">
         <span class="di" aria-hidden="true">📄</span>
         <span>${bi(x.en||'Document',x.ar||'وثيقة')}<small>${x.type||''}</small></span></a>`).join('')}</div>`
    : `<div class="pending">
         <div class="ico" aria-hidden="true">📬</div>
         <p style="font-weight:800;font-size:1.25rem">${bi('Documents are on their way!','الوثائق في الطريق إليك!','ctr')}</p>
         <p style="color:var(--ink2);font-weight:600">${bi('Your teacher will share them here soon.','سيشاركها المعلم هنا قريباً.','ctr')}</p>
         <span class="pill">⏳ Pending · <span lang="ar" dir="rtl">قيد الانتظار</span></span>
       </div>`;
  const m = page(l, `
    <nav class="crumbs"><a class="btn ghost" href="#/term/${tid}">← ${bi(t.en,t.ar,'ctr')}</a></nav>
    <section class="lesson-hero" style="--c:${p.c};--t:${p.t};--fg:${p.fg}">
      <span class="num" aria-hidden="true">${n}</span>
      <div><p style="font-weight:800;color:var(--ink2)">${t.en} · <span lang="ar" dir="rtl">${t.ar}</span></p>
        <h2 class="page-title">${bi('Lesson '+pad(n),'الدرس '+pad(n))}</h2></div>
    </section>
    <section class="zone" style="--c:${p.c};--t:${p.t}" aria-labelledby="zt">
      <h2 id="zt">📁 ${bi('Documents','الوثائق','row')}</h2>
      ${zone}
    </section>
    <div class="finish"><button class="btn ${isDone?'finished':''}" id="fin" aria-pressed="${isDone}">
      ${isDone ? bi('✓ Lesson finished!','✓ أنهيتَ الدرس!','ctr') : bi('I finished this lesson','أنهيتُ هذا الدرس','ctr')}</button></div>`, `${t.en} · Lesson ${pad(n)}`);
  const fin = m.querySelector('#fin');
  fin.onclick = () => {
    let list = doneList(l);
    list = list.includes(key) ? list.filter(x=>x!==key) : [...list,key];
    store.set('l','eh:done:'+l.key, JSON.stringify(list));
    renderLesson(l,tid,n); document.getElementById('fin').classList.add('pop');
  };
}

function go404(){ location.hash = '#/'; }

/* =====================================================================
   Router
   ===================================================================== */
function route(){
  const l = currentUser();
  if(!l){ return renderLogin(); }
  const h = (location.hash || '#/').split('/').filter(Boolean); // ['#','term','1','lesson','3']
  if(h[1]==='term' && h[3]==='lesson') return renderLesson(l,+h[2],+h[4]);
  if(h[1]==='term') return renderTerm(l,+h[2]);
  renderHome(l);
}
window.addEventListener('hashchange', route);
route();
</script>
